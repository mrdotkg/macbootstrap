# starship.toml — minimal starter.
# You already have a tuned muted-Catppuccin-stepped-grey config running on
# WSL — just copy that file over this one for a visually identical prompt
# on both machines. This version is only here so the Mac isn't left with
# starship's noisy default until you do that.

format = """
$directory\
$git_branch\
$git_status\
$character"""

[directory]
style = "blue bold"
truncation_length = 3

[git_branch]
style = "purple"

[git_status]
style = "red"

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
