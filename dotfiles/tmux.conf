# tmux.conf — mirrors the plugin set already running on the WSL side
# (resurrect, continuum, yank, fzf) so session-restore habits stay identical
# across both machines.

set -g mouse on
set -g history-limit 10000
set -g escape-time 10
set -g focus-events on
set -s set-clipboard on

# --- Plugins (installed via TPM, cloned by bootstrap.sh) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'sainnhe/tmux-fzf'

set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

# --- Sane pane splits ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Initialize TPM — keep this line last
run '~/.tmux/plugins/tpm/tpm'
