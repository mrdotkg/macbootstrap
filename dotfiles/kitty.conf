# kitty.conf — starter config
# Swap the color values below for your existing WezTerm Catppuccin-stepped-grey
# palette so the Mac and WSL sides look identical.

font_family      JetBrainsMono Nerd Font
font_size        13.0
disable_ligatures never

enable_audio_bell no
window_padding_width 4
confirm_os_window_close 0

# Scrollback: kept modest since tmux (with resurrect/continuum) is your real
# history/session layer, not kitty itself
scrollback_lines 5000

# SSH-first workflow: quick launch actions for your PC/WSL box.
# Replace HOST and USER below once, then `kitty @ launch` or a keybind can
# jump straight into a working session.
map ctrl+shift+p launch --type=os-window ssh -t USER@HOST "tmux new-session -A -s main"

